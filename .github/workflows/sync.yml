name: healing-room-sync

on:
  schedule:
    # 10분 간격 (UTC 기준). GitHub cron 은 수 분 늦게 뜰 수 있습니다.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '읽기만 하고 비교 결과만 출력'
        type: boolean
        default: false

concurrency:
  group: healing-room-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 판정 규칙 테스트
        run: python3 -m unittest discover -s tests

      - name: 로그인 세션 복원 (저장소에는 남기지 않음)
        uses: actions/cache/restore@v4
        with:
          path: state/session.json
          key: m33-session-${{ github.run_id }}
          restore-keys: m33-session-

      - name: 동기화 실행
        env:
          M33_EMAIL: ${{ secrets.M33_EMAIL }}
          M33_PASSWORD: ${{ secrets.M33_PASSWORD }}
          ZB_EMAIL: ${{ secrets.ZB_EMAIL }}
          ZB_PASSWORD: ${{ secrets.ZB_PASSWORD }}
          ZB_COOKIE: ${{ secrets.ZB_COOKIE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GCAL_WEBHOOK_URL: ${{ secrets.GCAL_WEBHOOK_URL }}
          GCAL_WEBHOOK_SECRET: ${{ secrets.GCAL_WEBHOOK_SECRET }}
          STATE_PATH: state/state.json
          SESSION_PATH: state/session.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          MODE=apply
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            MODE=dry-run
          fi
          python3 sync.py --mode "$MODE"

      - name: 로그인 세션 저장
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state/session.json
          key: m33-session-${{ github.run_id }}

      - name: 상태 저장
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "state 변경 없음"
            exit 0
          fi
          git config user.name  "healing-room-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A state/
          git commit -m "state: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break
            echo "push 재시도 $i"; sleep 5
          done
